name: Build and Deploy

on:
  push:
    branches: [main]
  # Intentionally no pull_request trigger — this repo is public and the deploy
  # job runs on a self-hosted runner (the Raspberry Pi). Triggering on
  # pull_request would let a fork PR run code on that machine. Only direct
  # pushes to main (i.e. people with write access) may trigger a deploy.

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ssheppard03/discordbot:latest
            ghcr.io/ssheppard03/discordbot:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull and restart
        run: |
          cd ~/nichebot
          docker compose pull
          docker compose up -d
